<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пешеходная доступность: Адмиралтейский район</title>
  <!-- Значка сайта нет: пустая ссылка убирает лишний запрос и ошибку 404 -->
  <link rel="icon" href="data:,">
  <!-- Версия закреплена: новая основная версия MapLibre могла бы сломать страницу -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #222;
    }
    #panel {
      box-sizing: border-box;
      width: 300px;
      flex: none;
      padding: 16px;
      overflow-y: auto;
      background: #fff;
      border-right: 1px solid #ddd;
    }
    #map { flex: 1; min-width: 0; }
    h1 { margin: 0 0 4px; font-size: 18px; line-height: 1.25; }
    h2 { margin: 16px 0 6px; font-size: 14px; }
    p { margin: 0; }
    .muted { color: #5f5f5f; font-size: 13px; }

    fieldset { margin: 0; padding: 0; border: 0; }
    legend { padding: 0; }
    #types label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
    #types img { width: 22px; height: 22px; }
    #types input { margin: 0; }

    #scale { margin: 0; padding: 0; list-style: none; }
    #scale li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
    #scale li[hidden] { display: none; }
    #scale .threshold { display: block; margin: 3px 0; padding: 2px 0 0; border-top: 2px solid #222; font-size: 12px; color: #5f5f5f; }
    .swatch { display: inline-block; flex: none; width: 18px; height: 14px; border: 1px solid rgba(0, 0, 0, .35); border-radius: 2px; }

    .swatch-hatch { background: repeating-linear-gradient(135deg, #8a8a8a 0 3px, #fff 3px 5px); }

    #summary { margin-top: 14px; padding: 8px 10px; background: #f2f3f0; border-radius: 4px; }
    #summary h2 { margin: 0 0 4px; }
    #summary-share { font-weight: 700; }
    #summary-median { margin-top: 2px; }

    #view-note { margin-top: 10px; }
    #note { margin-top: 10px; }
    #about { margin-top: 12px; }

    #error {
      display: none;
      position: fixed;
      top: 16px;
      left: 50%;
      z-index: 10;
      box-sizing: border-box;
      width: min(520px, calc(100vw - 32px));
      transform: translateX(-50%);
      padding: 16px;
      background: #fff;
      border: 2px solid #9c1f1f;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
    }
    #error code { display: block; margin: 8px 0; padding: 6px 8px; background: #f2f3f0; font-size: 13px; overflow-wrap: anywhere; }

    .maplibregl-popup-content { padding: 12px 14px; font: inherit; color: #222; }
    .popup-address { margin: 0 18px 8px 0; font-weight: 600; }
    .popup-times { border-collapse: collapse; width: 100%; }
    .popup-times td { padding: 2px 0; vertical-align: middle; }
    .popup-times td:last-child { padding-left: 12px; text-align: right; white-space: nowrap; }
    .popup-times .selected { font-weight: 700; }
    .popup-times .swatch { width: 10px; height: 10px; margin-right: 6px; }
    .popup-note { margin-top: 8px; font-size: 12px; color: #5f5f5f; }
    details { margin-top: 8px; font-size: 13px; }
    summary { cursor: pointer; }

    /* На узком экране панель над картой, а не сбоку */
    @media (max-width: 700px) {
      body { flex-direction: column; }
      #panel { width: 100%; max-height: 45%; border-right: 0; border-bottom: 1px solid #ddd; }
      #map { min-height: 0; }
    }
  </style>
</head>
<body>
  <aside id="panel">
    <h1>Сколько идти пешком</h1>
    <p class="muted">Жилые дома Адмиралтейского района, Санкт-Петербург</p>

    <fieldset>
      <legend><h2>До чего считаем время</h2></legend>
      <div id="types"></div>
    </fieldset>

    <section id="summary" aria-live="polite">
      <h2>Главное</h2>
      <p id="summary-share"></p>
      <p id="summary-median"></p>
    </section>

    <h2 id="scale-title"></h2>
    <ul id="scale"></ul>

    <p id="view-note" class="muted"></p>
    <p id="note" class="muted"></p>
    <p id="about" class="muted"></p>
  </aside>
  <div id="map"></div>
  <div id="error" role="alert"></div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script>
    // Светлая подложка без ключа доступа: не спорит с цветом домов
    const BASEMAP_URL = "https://tiles.openfreemap.org/styles/positron";

    // Типы объектов в переключателе. Столбец времени в data/access.geojson называется t_<key>,
    // значок лежит в icons/<key>.svg. Поясняющий текст получает настройки из data/map_config.json
    const TYPES = [
      {
        key: "school",
        label: "Школа",
        from: "от школы",
        note: () => "Только общеобразовательные школы, в том числе за границей района.",
      },
      {
        key: "kindergarten",
        label: "Детский сад",
        from: "от детского сада",
        note: () => "Все детские сады из OpenStreetMap, в том числе за границей района.",
      },
      {
        key: "clinic_adult",
        label: "Поликлиника",
        from: "от взрослой поликлиники",
        note: (settings) => `Только городские взрослые поликлиники, список отобран вручную. Полнота зависит от OpenStreetMap. Время больше ${settings.reliable_limit_min} минут может быть завышено: ближайшая поликлиника может лежать за краем данных.`,
      },
      {
        key: "park",
        label: "Парк",
        from: "от парка",
        note: (settings) => `Парки от ${settings.park_min_area_m2} м², кроме закрытых. Время считается до края парка, а значок стоит внутри него.`,
      },
      {
        key: "playground",
        label: "Детская площадка",
        from: "от детской площадки",
        note: () => "Площадки, кроме закрытых. Самый оптимистичный показатель: многие закрытые дворы в OpenStreetMap не отмечены.",
      },
    ];

    // Строки всплывающего окна сверх пяти типов переключателя
    const CHILD_CLINIC = { key: "clinic_child", label: "Детская поликлиника" };
    const CONTROLS = [
      { key: "school_public", label: "Государственная школа" },
      { key: "clinic_any", label: "Любая клиника из OpenStreetMap" },
    ];

    let map;
    let settings;
    // Сразу открываем поликлиники: здесь главный вывод проекта
    let selectedType = "clinic_adult";
    let homeProperties = [];
    let popup = null;
    let popupProperties = null;

    function showError(title, details, command) {
      const box = document.getElementById("error");
      box.replaceChildren();
      const heading = document.createElement("strong");
      heading.textContent = title;
      const text = document.createElement("p");
      text.textContent = details;
      box.append(heading, text);
      if (command) {
        const code = document.createElement("code");
        code.textContent = command;
        box.append(code);
      }
      box.style.display = "block";
    }

    async function fetchJson(path) {
      const response = await fetch(path);
      if (!response.ok) {
        throw new Error(`${path}: ответ сервера ${response.status}`);
      }
      return response.json();
    }

    function formatMinutes(value) {
      const number = value.toLocaleString("ru-RU", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      return `${number} мин`;
    }

    function formatPercent(share) {
      const number = (share * 100).toLocaleString("ru-RU", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      return `${number} %`;
    }

    function median(values) {
      const sorted = [...values].sort((a, b) => a - b);
      const middle = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
    }

    function colorFor(minutes) {
      const index = settings.time_breaks_min.findIndex((limit) => minutes <= limit);
      return settings.time_colors[index === -1 ? settings.time_colors.length - 1 : index];
    }

    // Выражение MapLibre для цвета дома или гексагона. Граница входит в нижний класс, поэтому нужен <=:
    // выражение step отнесло бы дом с временем ровно 15,0 к классу «дольше 15 минут»
    function colorExpression(field) {
      const time = ["get", field];
      const expression = ["case"];
      settings.time_breaks_min.forEach((limit, index) => {
        expression.push(["<=", time, limit], settings.time_colors[index]);
      });
      expression.push(settings.time_colors[settings.time_colors.length - 1]);
      return expression;
    }

    function buildTypeSwitch() {
      const container = document.getElementById("types");
      for (const type of TYPES) {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = "type";
        input.value = type.key;
        input.checked = type.key === selectedType;
        input.addEventListener("change", () => selectType(type.key));
        const icon = document.createElement("img");
        icon.src = `icons/${type.key}.svg`;
        icon.alt = "";
        label.append(input, icon, type.label);
        container.append(label);
      }
    }

    function buildScale() {
      const scale = document.getElementById("scale");
      const breaks = settings.time_breaks_min;
      settings.time_colors.forEach((color, index) => {
        let text;
        if (index === 0) {
          text = `до ${breaks[0]} мин`;
        } else if (index === breaks.length) {
          text = `больше ${breaks[index - 1]} мин`;
        } else {
          text = `${breaks[index - 1]}–${breaks[index]} мин`;
        }
        const row = document.createElement("li");
        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.background = color;
        row.append(swatch, text);
        scale.append(row);

        // Черта на пороге: выше неё идти не дольше порога, ниже дольше
        if (breaks[index] === settings.long_walk_min) {
          const threshold = document.createElement("li");
          threshold.className = "threshold";
          threshold.textContent = `порог ${settings.long_walk_min} минут`;
          scale.append(threshold);
        }
      });

      // Строка про штриховку нужна, только пока на карте гексагоны
      const hatched = document.createElement("li");
      hatched.id = "scale-hatched";
      const swatch = document.createElement("span");
      swatch.className = "swatch swatch-hatch";
      hatched.append(swatch, `меньше ${settings.hex_min_homes} домов: оценка ненадёжна`);
      scale.append(hatched);
    }

    function isHexView() {
      return map.getZoom() < settings.hex_max_zoom;
    }

    // Подписи зависят от того, что сейчас на карте: гексагоны или дома
    function updateViewNotes() {
      const hexView = isHexView();
      document.getElementById("scale-title").textContent = hexView ? "Медиана по гексагону" : "Время от дома до ближайшего объекта";
      document.getElementById("scale-hatched").hidden = !hexView;
      document.getElementById("view-note").textContent = hexView
        ? `Гексагон со стороной ${settings.hex_side_m} м. Цвет показывает середину ряда: даже в синем гексагоне часть домов может быть дальше порога. Приблизьте карту и щёлкните по дому, чтобы увидеть все времена.`
        : "Щёлкните по дому, чтобы увидеть все времена.";
    }

    // Цифры считаем из тех же домов, что на карте, поэтому они не разойдутся с данными
    function updateSummary() {
      const type = TYPES.find((item) => item.key === selectedType);
      const times = homeProperties.map((home) => home[`t_${selectedType}`]);
      const farCount = times.filter((minutes) => minutes > settings.long_walk_min).length;
      const share = farCount === 0 ? "0 %" : formatPercent(farCount / times.length);
      document.getElementById("summary-share").textContent =
        `${share} домов — дальше ${settings.long_walk_min} минут ${type.from}`;
      document.getElementById("summary-median").textContent = `Медиана — ${formatMinutes(median(times))}`;
    }

    function updateNote() {
      const type = TYPES.find((item) => item.key === selectedType);
      document.getElementById("note").textContent = type.note(settings);
    }

    function addTimeRows(table, rows, properties) {
      for (const row of rows) {
        const minutes = properties[`t_${row.key}`];
        const line = table.insertRow();
        if (row.key === selectedType) {
          line.className = "selected";
        }
        const name = line.insertCell();
        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.background = colorFor(minutes);
        name.append(swatch, row.mark ? `${row.label} (${row.mark})` : row.label);
        line.insertCell().textContent = formatMinutes(minutes);
      }
    }

    function makeTimeTable(rows, properties) {
      const table = document.createElement("table");
      table.className = "popup-times";
      addTimeRows(table, rows, properties);
      return table;
    }

    // Содержимое окна собираем через textContent: данные OSM не должны попасть в страницу как HTML
    function buildPopupContent(properties) {
      const content = document.createElement("div");

      const address = document.createElement("p");
      address.className = "popup-address";
      address.textContent = `${properties.street || "улица не указана"}, ${properties.housenumber || "номер не указан"}`;
      content.append(address);

      content.append(makeTimeTable([...TYPES, { ...CHILD_CLINIC, mark: "ненадёжно" }], properties));

      const childNote = document.createElement("p");
      childNote.className = "popup-note";
      childNote.textContent = "Все три детские поликлиники из данных лежат вне района, по этому числу нельзя делать выводы.";
      content.append(childNote);

      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = "Контрольные варианты";
      details.append(summary, makeTimeTable(CONTROLS, properties));
      content.append(details);

      if (properties.residential_source === "inferred") {
        const inferred = document.createElement("p");
        inferred.className = "popup-note";
        inferred.textContent = "В OpenStreetMap дом не отмечен как жилой, это предположение по правилу. При ручной проверке около 30 % таких зданий оказались нежилыми.";
        content.append(inferred);
      }
      return content;
    }

    function selectType(typeKey) {
      selectedType = typeKey;
      // Если слои ещё загружаются, они сами возьмут выбранный тип
      if (map.getLayer("objects")) {
        map.setPaintProperty("homes-fill", "fill-color", colorExpression(`t_${typeKey}`));
        map.setPaintProperty("hex-fill", "fill-color", colorExpression(`median_${typeKey}`));
        map.setFilter("objects", ["==", ["get", "type"], typeKey]);
      }
      updateNote();
      updateSummary();
      // Открытое окно обновляем, чтобы в нём выделился новый тип
      if (popup && popup.isOpen()) {
        popup.setDOMContent(buildPopupContent(popupProperties));
      }
    }

    function openPopup(lngLat, properties) {
      if (popup) {
        popup.remove();
      }
      popupProperties = properties;
      popup = new maplibregl.Popup({ maxWidth: "320px" })
        .setLngLat(lngLat)
        .setDOMContent(buildPopupContent(properties))
        .addTo(map);
    }

    async function loadIcon(typeKey) {
      const image = new Image(64, 64);
      image.src = `icons/${typeKey}.svg`;
      await image.decode();
      // Рисунок вдвое крупнее показа, чтобы значок оставался чётким
      map.addImage(`icon-${typeKey}`, image, { pixelRatio: 2 });
    }

    // Штриховка для гексагонов с малой выборкой: белые полосы поверх цвета. Бледность здесь не подходит,
    // потому что бледный тёмно-синий выглядел бы как другой класс времени
    function addHatchPattern() {
      const size = 16;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext("2d");
      context.strokeStyle = "#fff";
      context.lineWidth = 3;
      // Три линии нужны, чтобы полосы стыковались, когда плитка повторяется
      for (const shift of [-size, 0, size]) {
        context.beginPath();
        context.moveTo(shift, size);
        context.lineTo(shift + size, 0);
        context.stroke();
      }
      map.addImage("hatch", context.getImageData(0, 0, size, size), { pixelRatio: 2 });
    }

    // В стиле подложки подписи на двух языках. Оставляем русское название, а если его нет, то местное
    function useRussianLabels() {
      for (const layer of map.getStyle().layers) {
        const textField = layer.layout && layer.layout["text-field"];
        if (textField && JSON.stringify(textField).includes("name")) {
          map.setLayoutProperty(layer.id, "text-field", ["coalesce", ["get", "name:ru"], ["get", "name:nonlatin"], ["get", "name"]]);
        }
      }
    }

    async function addDataLayers(homes, objects, boundary, hexagons) {
      useRussianLabels();
      addHatchPattern();
      await Promise.all(TYPES.map((type) => loadIcon(type.key)));

      map.addSource("homes", { type: "geojson", data: homes });
      map.addSource("objects", { type: "geojson", data: objects });
      map.addSource("boundary", { type: "geojson", data: boundary });
      map.addSource("hexagons", { type: "geojson", data: hexagons });

      // Дома и гексагоны кладём под подписи подложки, чтобы названия улиц оставались читаемыми
      const firstLabel = map.getStyle().layers.find((layer) => layer.type === "symbol");
      const beforeLabels = firstLabel ? firstLabel.id : undefined;

      // На мелком масштабе видны гексагоны, с масштаба hex_max_zoom — дома. В один момент виден только один вид
      map.addLayer({
        id: "hex-fill",
        type: "fill",
        source: "hexagons",
        maxzoom: settings.hex_max_zoom,
        paint: { "fill-color": colorExpression(`median_${selectedType}`), "fill-opacity": 0.85 },
      }, beforeLabels);
      map.addLayer({
        id: "hex-hatch",
        type: "fill",
        source: "hexagons",
        maxzoom: settings.hex_max_zoom,
        filter: ["==", ["get", "low_sample"], true],
        paint: { "fill-pattern": "hatch" },
      }, beforeLabels);
      map.addLayer({
        id: "hex-line",
        type: "line",
        source: "hexagons",
        maxzoom: settings.hex_max_zoom,
        paint: { "line-color": "#fff", "line-width": 1 },
      }, beforeLabels);
      map.addLayer({
        id: "homes-fill",
        type: "fill",
        source: "homes",
        minzoom: settings.hex_max_zoom,
        paint: { "fill-color": colorExpression(`t_${selectedType}`), "fill-opacity": 0.9 },
      }, beforeLabels);
      // Тонкий контур отделяет соседние дома и помогает светлым классам не теряться на фоне
      map.addLayer({
        id: "homes-line",
        type: "line",
        source: "homes",
        minzoom: settings.hex_max_zoom,
        paint: { "line-color": "#222", "line-opacity": 0.4, "line-width": 0.5 },
      }, beforeLabels);
      // Граница района: тёмная линия с белой окантовкой видна и на подложке, и поверх цветных гексагонов
      map.addLayer({
        id: "boundary-halo",
        type: "line",
        source: "boundary",
        paint: { "line-color": "#fff", "line-width": 5, "line-opacity": 0.9 },
      }, beforeLabels);
      map.addLayer({
        id: "boundary-line",
        type: "line",
        source: "boundary",
        paint: { "line-color": "#111", "line-width": 2.25 },
      }, beforeLabels);
      map.addLayer({
        id: "objects",
        type: "symbol",
        source: "objects",
        filter: ["==", ["get", "type"], selectedType],
        layout: {
          "icon-image": ["concat", "icon-", ["get", "type"]],
          // Значки не прячем при наложении: скрытый значок выглядел бы как отсутствие объекта
          "icon-allow-overlap": true,
          "icon-ignore-placement": true,
          "icon-size": ["interpolate", ["linear"], ["zoom"], 11, 0.3, 14, 0.55, 17, 1],
        },
      });

      map.on("click", "homes-fill", (event) => openPopup(event.lngLat, event.features[0].properties));
      map.on("mouseenter", "homes-fill", () => { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", "homes-fill", () => { map.getCanvas().style.cursor = ""; });
    }

    function createMap(boundary) {
      const area = boundary.features[0].properties;
      map = new maplibregl.Map({
        container: "map",
        style: BASEMAP_URL,
        bounds: [[area.bbox_west, area.bbox_south], [area.bbox_east, area.bbox_north]],
        fitBoundsOptions: { padding: 24 },
        attributionControl: { customAttribution: "Дома и объекты © участники OpenStreetMap" },
        locale: {
          "NavigationControl.ZoomIn": "Приблизить",
          "NavigationControl.ZoomOut": "Отдалить",
          "Popup.Close": "Закрыть",
          "AttributionControl.ToggleAttribution": "Показать источники",
        },
      });
      map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
    }

    async function main() {
      // Из файла браузер не даст прочитать данные, поэтому сразу объясняем, как открыть страницу
      if (location.protocol === "file:") {
        showError(
          "Страницу нужно открывать через локальный сервер",
          "При открытии двойным щелчком браузер запрещает читать файлы с данными. В корне проекта выполните команду и откройте http://localhost:8000/",
          ".venv\\Scripts\\python.exe -m http.server 8000",
        );
        return;
      }
      if (typeof maplibregl === "undefined") {
        showError("Не загрузилась библиотека карты", "Проверьте подключение к интернету и обновите страницу.");
        return;
      }

      let homes, objects, boundary, hexagons;
      try {
        [settings, homes, objects, boundary, hexagons] = await Promise.all([
          fetchJson("data/map_config.json"),
          fetchJson("data/access.geojson"),
          fetchJson("data/map_objects.geojson"),
          fetchJson("data/boundary.geojson"),
          fetchJson("data/access_hex.geojson"),
        ]);
      } catch (error) {
        showError("Не загрузились данные карты", error.message);
        return;
      }

      homeProperties = homes.features.map((feature) => feature.properties);

      buildTypeSwitch();
      buildScale();
      updateNote();
      updateSummary();
      document.getElementById("about").textContent =
        `Скорость ${settings.walk_speed_kmh} км/ч. Входы в дома неизвестны, поэтому время отдельного дома может отличаться на несколько минут.`;

      createMap(boundary);
      updateViewNotes();
      map.on("zoom", updateViewNotes);

      // Ошибка до загрузки стиля значит, что недоступна подложка. Отдельный пропавший фрагмент карты не страшен
      let styleLoaded = false;
      map.on("style.load", () => { styleLoaded = true; });
      map.on("error", (event) => {
        console.error(event.error);
        if (!styleLoaded) {
          showError("Не загрузилась подложка карты", "Проверьте подключение к интернету и обновите страницу.");
        }
      });
      map.on("load", () => {
        addDataLayers(homes, objects, boundary, hexagons).catch((error) => {
          console.error(error);
          showError("Не удалось показать данные на карте", error.message);
        });
      });
    }

    main();
  </script>
</body>
</html>
